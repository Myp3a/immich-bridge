[project]
name = "immich-bridge"
version = "0.1.0"
description = "iCloud to Immich bridge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "osxphotos>=0.72.1",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "mypy>=1.17.1",
    "pre-commit>=4.3.0",
    "ruff>=0.12.10",
]

[project.scripts]
sync = "main:sync"
